---

- hosts: all 
  become: true 
  pre_tasks:  

  - name: install updates
    tags: always
    apt:
      upgrade: dist
      update_cache: yes 

- hosts: web_servers
  become: true
  tasks:   

  - name: install apache
    tags: apache,apache2,ubuntu
    apt:
      name:
        - apache2
        - php 
      state: latest 

  - name: start apache2 (Ubuntu) 
    tags: apache,ubuntu,httpd
    service: 
      name: apache2
      state: started 
      enabled: yes  
    when: ansible_distribution == "Ubuntu" 


  - name: copy default html file for site.
    tags: apache,apache2,httpd 
    copy: 
      src: default_site.html 
      dest: /var/www/html/index.html
      owner: root 
      group: root
      mode: 0644 


- hosts: workstations 
  become: true
  tasks: 

  - name: install unzip 
    package: 
      name: unzip 

  - name: install Terraform 
    unarchive: 
      src: https://releases.hashicorp.com/terraform/1.17.0/terraform_1.17.0_linux_arm64.zip
      dest: /usr/local/bin 
      remote_src: yes
      mode: 0755
      owner: root 
      group: root 


  

- hosts: db_servers
  become: true
  tasks:
 
  - name: install mariadb package (Ubuntu)
    tags: db,mariadb,ubuntu
    apt:
      name: 
        - mariadb-server
      state: latest  
    when: ansible_distribution == "Ubuntu" 
  
  - name: install samba package 
    tags: samba 
    package: 
      name: samba
      state: latest 
