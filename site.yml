---

- hosts: all 
  become: true 
  pre_tasks:  

  - name: install updates
    tags: always
    apt:
      upgrade: dist
      update_cache: yes 

- hosts: web_servers
  become: true
  tasks:   

  - name: install apache
    tags: apache,apache2,ubuntu
    apt:
      name:
        - apache2
        - php 
      state: latest 

- hosts: db_servers
  become: true
  tasks:
 
  - name: install mariadb package (Ubuntu)
    tags: db,mariadb,ubuntu
    apt:
      name: 
        - mariadb-server
      state: latest  
    when: ansible_distribution == "Ubuntu" 
  
  - name: install samba package 
    tags: samba 
    package: 
      name: samba
      state: latest 
