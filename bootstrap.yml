---


- hosts: all 
  become: true 
  tasks:  

  - name: create Simone user
    tags: always
    user:
      name: Simone
      groups: root  
  
  - name: adding ssh key for Simone.
    tags: always
    authorized_key:
      user: Simone
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHDCOqcdcLIOiWL0lPNgOWyuLt2VjCCb8Q/vzV9GMng6 ansible" 

  - name: add sudoers file for Simone 
    tags: always
    copy:
      src: sudoer_Simone
      dest: /etc/sudoers.d/Simone
      owner: root
      group: root
      mode: 0440
